<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>10,000 Real-Time Checkboxes</title>
      <style>
        :root {
          color-scheme: dark;
          font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
        }

        body {
          margin: 0;
          padding: 20px;
          background: #0d1117;
          color: #e6edf3;
        }

        h1 {
          margin-top: 0;
          font-size: 1.25rem;
        }

        p {
          margin: 0 0 16px;
          color: #9da7b3;
        }

        #checkbox-grid {
          display: grid;
          grid-template-columns: repeat(auto-fill, 35px);
          gap: 8px;
          align-items: center;
        }

        .cell {
          display: flex;
          align-items: center;
          gap: 6px;
          padding: 6px 5px;
          border: 1px solid #30363d;
          border-radius: 8px;
          background: #161b22;
        }

        /* label {
          font-size: 0.72rem;
          user-select: none;
        } */
      </style>
  </head>
  <body>
      <h1>10,000 Real-Time Checkboxes</h1>
      <p>All updates are synced and persisted through the server.</p>
      <div id="checkbox-grid"></div>

      <script src="/socket.io/socket.io.js"></script>
      <script>
        const CHECKBOX_COUNT = 10000
        const socket = io()
        const grid = document.getElementById("checkbox-grid")
        const checkboxes = new Array(CHECKBOX_COUNT)

        const createCheckboxes = () => {
          const fragment = document.createDocumentFragment()

          for (let i = 0; i < CHECKBOX_COUNT; i += 1) {
            const wrapper = document.createElement("div")
            wrapper.className = "cell"

            const input = document.createElement("input")
            input.type = "checkbox"
            input.id = `checkbox-${i}`
            input.dataset.index = String(i)

            wrapper.appendChild(input)
            fragment.appendChild(wrapper)
            checkboxes[i] = input
          }

          grid.appendChild(fragment)
        }

        grid.addEventListener("change", (e) => {
          // If a user updates the state of any checkbox, the browser updates the UI instantly.
          // not blocking that native update. Instead, the client side socket will 
          // optimistically send an "Update" event to the server in the background
          // with the index and the checked state of the checkbox.
          if (e.target.type !== "checkbox") 
            return
            
          const index = Number(e.target.dataset.index)
          
          // one particular socket is sending the "Update" event for a particular checkbox
          socket.emit("Update", {index, checkedFlag: e.target.checked}) 
        })

        socket.on("PersistedState", (checkedIndices) => {
          // Based on the initial "PersistedState" event and the array of checked indices, 
          // update the checkbox states to sync with the Redis database on first load.
          if (!Array.isArray(checkedIndices)) return
          checkedIndices.forEach((i) => {
            if (i >= 0 && i < CHECKBOX_COUNT) 
              checkboxes[i].checked = true
          })
        })

        socket.on("Update", ({index, checkedFlag}) => {
          // Broadcasted "Update" event from the server side to all the other users regarding a particular checkbox's state. 
          // if (!Number.isInteger(index) || index < 0 || index >= CHECKBOX_COUNT) {
          //   return
          // }

          // OPTIMISTIC UI CHECK: Only update the DOM if the incoming server state is actually different from what the user currently sees. This prevents the checkbox from "flickering" or causing lag if the server echoes back the change this specific user just made.
          // if (checkboxes[index].checked !== Boolean(checkedFlag)) {
            checkboxes[index].checked = Boolean(checkedFlag)
          // }
        })

        createCheckboxes()
      </script>
  </body>
</html>
